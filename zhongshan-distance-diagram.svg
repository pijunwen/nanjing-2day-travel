<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">南京钟山景区点位距离示意图</title>
  <desc id="desc">梧桐大道、美龄宫、明孝陵、音乐台、中山陵和灵谷寺的相对位置与参考距离。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#233b38" flood-opacity=".12"/>
    </filter>
    <style>
      .bg { fill: #f5f1e9; }
      .title { fill: #213236; font: 700 32px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #687572; font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .note { fill: #7c8782; font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .node-title { fill: #213236; font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .node-subtitle { fill: #687572; font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .distance { fill: #2f625d; font: 700 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .distance-warm { fill: #b96f47; font: 700 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .node { fill: #fffdf8; stroke: #d8d0c4; stroke-width: 1.5; }
      .node-highlight { fill: #e5efeb; stroke: #8fb5a8; stroke-width: 1.5; }
      .node-warm { fill: #fbede2; stroke: #d69b75; stroke-width: 1.5; }
      .walk { stroke: #2f625d; stroke-width: 5; stroke-linecap: round; }
      .transfer { stroke: #c77e50; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 10; }
      .guide { stroke: #d9d1c4; stroke-width: 1; stroke-dasharray: 5 8; }
      .legend-text { fill: #52615f; font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760" rx="28"/>
  <text class="title" x="64" y="70">钟山景区｜点位关系示意</text>
  <text class="subtitle" x="64" y="103">按“梧桐大道（陵园路主段）”中段作参考；距离是地图直线近似，实际以入口和园区接驳为准。</text>

  <path class="guide" d="M80 180 C280 100 560 110 1110 175"/>
  <path class="guide" d="M130 560 C400 390 770 350 1085 520"/>

  <line class="walk" x1="170" y1="210" x2="400" y2="210"/>
  <line class="walk" x1="520" y1="210" x2="760" y2="210"/>
  <line class="transfer" x1="880" y1="210" x2="1025" y2="210"/>

  <line class="walk" x1="245" y1="278" x2="420" y2="470"/>
  <line class="walk" x1="525" y1="520" x2="690" y2="520"/>
  <line class="transfer" x1="810" y1="520" x2="1025" y2="265"/>

  <g filter="url(#shadow)">
    <rect class="node-highlight" x="70" y="160" width="280" height="100" rx="18"/>
    <text class="node-title" x="95" y="200">梧桐大道</text>
    <text class="node-subtitle" x="95" y="228">陵园路主段 · 道路景观</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="400" y="160" width="240" height="100" rx="18"/>
    <text class="node-title" x="425" y="200">美龄宫</text>
    <text class="node-subtitle" x="425" y="228">建筑参观 · 需看开放安排</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node" x="760" y="160" width="240" height="100" rx="18"/>
    <text class="node-title" x="785" y="200">明孝陵</text>
    <text class="node-subtitle" x="785" y="228">遗址与神道 · 体量较大</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node-warm" x="1025" y="160" width="125" height="100" rx="18"/>
    <text class="node-title" x="1050" y="200">灵谷寺</text>
    <text class="node-subtitle" x="1050" y="228">更适合接驳</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="node-highlight" x="360" y="470" width="250" height="100" rx="18"/>
    <text class="node-title" x="385" y="510">音乐台</text>
    <text class="node-subtitle" x="385" y="538">与中山陵适合连逛</text>
  </g>
  <g filter="url(#shadow)">
    <rect class="node-highlight" x="610" y="470" width="250" height="100" rx="18"/>
    <text class="node-title" x="635" y="510">中山陵</text>
    <text class="node-subtitle" x="635" y="538">主线台阶较多</text>
  </g>

  <text class="distance" x="250" y="187" text-anchor="middle">约 0.4 km 直线</text>
  <text class="distance" x="250" y="290" text-anchor="middle">步行约 0.6—1.0 km</text>
  <text class="distance" x="640" y="187" text-anchor="middle">约 1.8 km 直线</text>
  <text class="distance" x="640" y="290" text-anchor="middle">步行约 1.5—2.5 km</text>
  <text class="distance-warm" x="950" y="187" text-anchor="middle">约 2.7 km 直线</text>
  <text class="distance-warm" x="950" y="290" text-anchor="middle">不建议徒步串联</text>
  <text class="distance" x="305" y="367" text-anchor="middle">约 1.3 km 直线</text>
  <text class="distance" x="305" y="389" text-anchor="middle">步行约 20—30 分钟</text>
  <text class="distance" x="610" y="505" text-anchor="middle">约 0.4 km 直线</text>
  <text class="distance" x="610" y="608" text-anchor="middle">步行约 10—15 分钟</text>
  <text class="distance-warm" x="920" y="415" text-anchor="middle">约 1.4 km 直线</text>
  <text class="distance-warm" x="920" y="437" text-anchor="middle">接驳 / 网约车更省力</text>

  <line class="walk" x1="75" y1="660" x2="125" y2="660"/>
  <text class="legend-text" x="140" y="665">适合慢慢步行</text>
  <line class="transfer" x1="300" y1="660" x2="350" y2="660"/>
  <text class="legend-text" x="365" y="665">建议接驳或短途车</text>
  <text class="note" x="64" y="710">决策重点：想看音乐台，就把“音乐台＋中山陵”作为一组；想看梧桐和明孝陵，就走“梧桐大道＋美龄宫＋明孝陵”一组。</text>
</svg>
